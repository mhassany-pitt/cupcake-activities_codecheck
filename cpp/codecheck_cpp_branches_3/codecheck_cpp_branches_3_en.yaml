    snippet: "#include <iostream>\n#include <string>\nusing namespace std;\n\nint main()\n{\n\n\n\n   string input = \"a1\"\
      ; \n   string column = input.substr(0, 1);\n   string row = input.substr(1, 1);\n   string output;\n   cout << output\
      \ << endl;\n   return 0;\n}\n"
