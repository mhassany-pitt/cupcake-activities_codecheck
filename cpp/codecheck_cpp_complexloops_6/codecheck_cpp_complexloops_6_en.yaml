      /** Helpber function. */
      bool all_zeros(const vector<vector<int>>& v, int r1, int c1, int r2, int c2)
      {
         for (int r = r1; r <= r2; r++)
         {
            for (int c = c1; c <= c2; c++)
            {
               if (v[r][c] != 0) { return false; }
            }
         }
         return true;
      }
