statement: |-
  <p>A <i>run</i> is a sequence of adjacent repeated values. For example,
      the array with elements</p>

      <pre>1 2 2 2 1 3 3 2</pre>

      <p>has two runs: <code>2 2 2</code> and <code>3 3</code>.</p>

      <p>Your job is to compute the length of the longest run. For example, with
      the preceding array, the longest run <code>2 2 2</code> has length 3.</p>
