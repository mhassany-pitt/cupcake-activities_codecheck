statement: |-
  <p>Count the number of even and odd elements in an array of integers. Since you
      must return two counts, place them into an array of length 2. For example,
      if you are given the array</p>

      <pre>1, 4, 9, 16, 25</pre>

      <p>you return the array with elements</p>

      <pre>2, 3</pre>

      <p>since there were two even and three odd elements.</p>
