statement: |-
  <p>An open interval is the set of all numbers between a lower and upper
      bound. In mathematical notation, we write </p>

      <p>(a, b) = { x | a &lt; x &lt; b }</p>

      <p>Your task is to determine when two intervals <i>overlap</i>. For
      example, the intervals (1, 3) and (2, 4) overlap, as do (1, 4) and (2, 3).
      But the intervals (1, 2) and (3, 4) do not overlap.</p>
elements:
- type: locked
  location:
    snippet: |
      public class Interval
      {
         private double lower;
         private double upper;

         /**
            Constructs an open interval.
            @param aLowerBound the lower bound
            @param anUpperBound the upper bound
         */
         public Interval(double aLowerBound, double anUpperBound)
         {
            lower = aLowerBound;
            upper = anUpperBound;
         }

         /**
            Checks whether a value is contained in the interval.
            @param x a value
            @return true if x is contained in the interval
         */
         public boolean contains(double x)
         {
            return lower < x && x < upper;
         }

         /**
            Gets the lower bound of this interval.
            @return the lower bound
         */
         public double getLower()
         {
            return lower;
         }

         /**
            Gets the lower bound of this interval.
            @return the lower bound
         */
         public double getUpper()
         {
            return upper;
         }

         /**
            Checks whether this interval overlaps with another.
            @param other another interval
            @return true if this interval and other overlap, i.e.
            have a non-empty intersection
         */
         public boolean overlaps(Interval other)
         {
