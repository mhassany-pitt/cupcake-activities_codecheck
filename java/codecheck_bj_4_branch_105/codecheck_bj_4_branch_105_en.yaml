statement: |-
  <p>A non-vertical line in the plane can be described by the slope/y
      intercept equation</p>

      <p><i>y</i> = <i>m</i> <i>x</i> + <i>b</i></p>

      <p>The <code>Line</code> class below models lines that are given in this
      way.</p>

      <p>Your job is to find out whether two lines intersect. Lines with
      different slopes will always intersect. Lines with the same slope are
      parallel, so they don't intersect, <i>except</i> when they are
      identical.</p>
