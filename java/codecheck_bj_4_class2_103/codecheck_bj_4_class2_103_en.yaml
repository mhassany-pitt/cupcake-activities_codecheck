statement: "The constructor of the `Sentence` class below makes assumptions\n    about the `text` parameter: \n\n<ul>\n<li>`text`\
  \ should end in a punctuation symbol (. ? !) </li>\n\n<li>The words in `text` should be separated by single spaces.\n</li>\n\
  </ul>\n\nFor example,\n\n```\nnew Sentence(\"Mary had a little lamb.\")\n```\n\nis ok, but\n\n```\nnew Sentence(\"Mary had\
  \ a little lamb\")\n```\n\nand\n\n```\nnew Sentence(\"Mary  had  a  little  lamb!\")\n```\n\nare not.\n\nYou should add\
  \ `assert` statements to the constructor that check\n    for these preconditions. \n\nThe `check` method uses exception\
  \ handling, a technique\n    introduced in Chapter 11 of the text, to check that you inserted the\n    appropriate `assert`\
  \ statements. You need not understand the\n    implementation of the `check` method at this time, and you should\n    not\
  \ modify it."
