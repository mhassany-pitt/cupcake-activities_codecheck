statement: |-
  <p>The constructor of the <code>SalaryBonus</code> class below makes the following assumptions;
       </p>

      <ul>
        <li><code>salary</code> should not exceed 150,000. </li>

        <li><code>bonusRate</code> should not exceed 5%.
        </li>
      </ul>

      <p>You should add <code>assert</code> statements to the constructor that check
      for these preconditions. </p>

      <p>The <code>check</code> method uses exception handling, a technique
      introduced in Chapter 11 of the text, to check that you inserted the
      appropriate <code>assert</code> statements. You need not understand the
      implementation of the <code>check</code> method at this time, and you should
      not modify it. </p>
