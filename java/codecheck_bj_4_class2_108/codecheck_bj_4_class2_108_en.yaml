statement: "The constructor of the `SalaryBonus` class below makes the following assumptions;\n\n<ul>\n<li>`salary` should\
  \ not exceed 150,000. </li>\n\n<li>`bonusRate` should not exceed 5%.\n</li>\n</ul>\n\nYou should add `assert` statements\
  \ to the constructor that check\n    for these preconditions. \n\nThe `check` method uses exception handling, a technique\n\
  \    introduced in Chapter 11 of the text, to check that you inserted the\n    appropriate `assert` statements. You need\
  \ not understand the\n    implementation of the `check` method at this time, and you should\n    not modify it."
