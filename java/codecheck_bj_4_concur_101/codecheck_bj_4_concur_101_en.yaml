statement: |-
  We want to simulate multiple rocket launches by ACME Rocket Inc. Each
      launch has a countdown, like this

  `10...`(delay)`9...`(delay)`8...`(delay)...
  `1...`(delay)`Liftoff`

  The initial counter value and the delay (in milliseconds) are variable.
