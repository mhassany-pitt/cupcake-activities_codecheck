    snippet: "import java.util.concurrent.locks.Lock;\nimport java.util.concurrent.locks.ReentrantLock;\n\npublic class DataSet\n\
      {\n   /**\n      Constructs an empty data set.\n   */\n   public DataSet(double[] values)\n   {\n      sum = 0;    \
      \  \n      this.values = values;\n      myLock = new ReentrantLock();      \n   }\n\n   private class RangeProcessor\
      \ implements Runnable\n   {\n      public RangeProcessor(int start, int end)\n      {\n         this.start = start;\n\
      \         this.end = Math.min(end, values.length);\n      }\n      \n      public void run()\n      {\n         // TODO:\
      \ use lock to protect access to shared mutated variables\n         double total = 0;\n         for (int i = start; i\
      \ < end; i++)\n            total += values[i];\n         sum += total;\n         completionCount++;\n      }\n     \
      \ \n      private int start;\n      private int end;\n   }\n   \n   /**\n      Gets the average of the added data.\n\
      \      @return the average or 0 if no data has been added\n   */\n   public double getAverage() \n   {\n      if (values.length\
      \ == 0) return 0;\n      \n      final int THREADS = 10;      \n      int size = values.length / THREADS;\n      for\
      \ (int i = 0; i < THREADS; i++)\n      {\n         Runnable r = new RangeProcessor(i * size, (i + 1) * size);\n    \
      \     Thread t = new Thread(r);\n         t.start();\n      }\n      \n      // busy waiting is not an optimal solution\n\
      \      final int DELAY = 100;\n      try\n      {\n         while (completionCount < THREADS)\n         {         \n\
      \            Thread.sleep(DELAY);\n         }\n      }\n      catch (InterruptedException ex)\n      {\n         return\
      \ 0; \n      }         \n      \n      return sum / values.length;\n   }\n\n   private double[] values;\n   private\
      \ double sum;\n   private int completionCount;\n   private Lock myLock;\n   \n   // this method is used to check your\
      \ work\n   \n   public static void main(String[] args)  \n   {\n      final int SIZE = 10000000;\n      double[] v =\
      \ new double[SIZE];\n      for (int i = 0; i < SIZE; i++) v[i] = i;\n      DataSet data = new DataSet(v);\n      double\
      \ avg = data.getAverage();\n      System.out.println(avg);\n   }\n}\n"
