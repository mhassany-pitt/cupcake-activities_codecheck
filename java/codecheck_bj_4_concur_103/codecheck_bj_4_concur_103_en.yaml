    snippet: "import java.util.concurrent.locks.Condition;\nimport java.util.concurrent.locks.Lock;\nimport java.util.concurrent.locks.ReentrantLock;\n\
      \npublic class DataSet\n{\n   /**\n      Constructs an empty data set.\n   */\n   public DataSet(double[] values)\n\
      \   {\n      this.values = values;\n      max = 0;      \n      myLock = new ReentrantLock();\n      completionCondition\
      \ = myLock.newCondition();      \n   }\n\n   /**\n      Gets the maximum of the added data.\n      @return the average\
      \ or 0 if no data has been added\n   */\n   public double getMaximum() \n   {\n      if (values.length == 0) return\
      \ 0;\n\n      max = values[0];      \n      final int THREADS = 10;      \n      int size = values.length / THREADS;\n\
      \      for (int i = 0; i < THREADS; i++)\n      {\n         Runnable r = new RangeProcessor(i * size, (i + 1) * size);\n\
      \         Thread t = new Thread(r);\n         t.start();\n      }\n\n      // Wait while the completion count is less\
      \ than the number of threads,\n      // Use the await method. Do not call sleep. Do not use a \"do nothing loop\". \n\
      \      \n      // TODO: your work here\n      \n      return max;\n   }\n\n   private class RangeProcessor implements\
      \ Runnable\n   {\n      public RangeProcessor(int start, int end)\n      {\n         this.start = start;\n         this.end\
      \ = Math.min(end, values.length);\n      }\n      \n      public void run()\n      {\n         double rangeMax = values[start];\n\
      \         for (int i = start + 1; i < end; i++)\n            rangeMax = Math.max(rangeMax, values[i]);\n         myLock.lock();\n\
      \         try\n         {\n            max = Math.max(max, rangeMax);\n            completionCount++;\n            \n\
      \            // TODO: signal that the completion count changed \n            \n         }\n         finally\n      \
      \   {\n            myLock.unlock();\n         }\n         \n      }\n      \n      private int start;\n      private\
      \ int end;\n   }\n   \n   private double[] values;\n\n   private double max;\n   private int completionCount;\n   private\
      \ Lock myLock;\n   private Condition completionCondition;\n   \n   // this method is used to check your work\n   \n\
      \   public static void main(String[] args)  \n   {\n      final int SIZE = 10000000;\n      double[] v = new double[SIZE];\n\
      \      int shift = (int) (Math.random() * SIZE);\n      for (int i = 0; i < SIZE; i++) v[(i + shift) % SIZE] = i;\n\
      \      DataSet data = new DataSet(v);\n      double max = data.getMaximum();\n      System.out.println(max);\n   }\n\
      }\n"
