statement: |-
  <p>Latitude and longitude are measured in degrees, minutes and seconds.  As with time measurements, there are 60 seconds to a minute, and 60 minutes to a degree. Many GIS (Geographical Information System) programs express latitude and longitude in degrees only, with the minutes and seconds converted to fractional degrees.  For example, </p>
  <pre>
     Latitude 40°15'30" can also be expressed as Latitude 40.25833333333333
  </pre>
  <p>Implement a method <code>decimalDegrees</code> to carry out this conversion. Note that degrees may be negative. Use the <code>Math</code> class method <code>abs</code> when computing the decimal degrees.  Use the <code>Math</code> class method <code>signum</code> as a multiplier so that the decimal degrees have the same sign as the degrees.</p>
