statement: "Latitude and longitude can be expressed in the form of decimal degrees.  Another form, often used on maps, is\
  \ degrees, minutes and seconds.  An example is:\n\nLatitude 40.25833 written as Latitude 40°15'30\" \n\nAs with time measurements,\
  \ there are 60 seconds in a minute and 60 minutes in a degree.\n\nImplement a method `convert` that converts decimal degrees\
  \ to a `String` with degrees, minutes and seconds in the form `xxx°xx\"xx.xx'`. Seconds may have a fractional part. The\
  \ unicode character `'\\u00B0'` is the degree symbol."
