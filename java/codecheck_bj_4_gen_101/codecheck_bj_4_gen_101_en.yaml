      \ method is used to check your work\n\n   public static String check(int r, int c, String s)\n   {\n      int rows =\
      \ 3;\n      int columns = 4;\n\n      Matrix<String> m = new Matrix<String>(rows, columns);\n\n      // add letters\
      \ of s diagonally\n      for (int i = 0; i < s.length(); i++)\n      {\n         m.put(r, c, s.substring(i, i + 1));\n\
      \         r++; if (r >= rows) r = 0;\n         c++; if (c >= columns) c = 0;\n      }\n   \n      // make string representing\
      \ matrix content\n      String t = \"\";\n      for (int i = 0; i < rows; i++)\n         for (int j = 0; j < columns;\
      \ j++)\n            if (m.get(i, j) == null) \n               t += \".\"; \n            else \n               t += m.get(i,\
      \ j);\n      return t;\n   }\n}\n"
