  location:
    snippet: "import java.util.ArrayList;\n\npublic class Matrix<T>\n{\n   public Matrix(int rows, int columns)\n   {\n  \
      \    this.rows = rows;\n      this.columns = columns;\n      elements = new ArrayList<ArrayList<T>>();\n      for (int\
      \ i = 0; i < rows; i++)\n      {\n         ArrayList<T> row = new ArrayList<T>();\n         for (int j = 0; j < columns;\
      \ j++)\n            row.add(null);\n         \n         elements.add(row);\n      }\n   }\n\n"
