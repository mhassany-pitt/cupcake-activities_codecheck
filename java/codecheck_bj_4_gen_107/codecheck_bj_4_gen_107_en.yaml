statement: |-
  The class below has a static method which sets all elements of an array to a value.
  The method is written for an array of strings. This will cause the method to not compile when invoked on arrays of other types. You will need to modify
  it so that it works for any type.
elements:
- type: editable
  location:
    snippet: |
      public class GenericArray
      {
         /**
            @param array is a generic array
            @param value all array elements are set to this value
         */
         public static void setAll(String[] array, String value)
         {
            for (int i = 0; i < array.length; i++)
               array[i] = value;
         }
      }
