statement: |-
  <p>Recall that a predicate is a method with a Boolean return value. The <code>Predicate</code> interface can be used to test whether a value fulfills a property. A class implementing this interface provides an <code>invoke</code> method for carrying out a particular test.</p>
  <p>The <code>GenericUtil</code> class contains a generic static method that finds all values in an array that match a given predicate. Your task is to implement that method.</p>
