statement: |-
  <p>You are given a class <code>Rectangle</code> that produces <q>ASCII
      art</q> rectangles such as the following:</p>

      <pre>+-------------+
  |             |
  |             |
  |             |
  |             |
  |             |
  +-------------+</pre>

      <p>The code is given below. </p>

      <p>Your task is to produce a subclass <code>FilledRectangle</code> that
      produces figures such as</p>

      <pre>+-------------+
  |#############|
  |#############|
  |#############|
  |#############|
  |#############|
  +-------------+</pre>

      <p>(when the fill character is <code>#</code>). </p>
