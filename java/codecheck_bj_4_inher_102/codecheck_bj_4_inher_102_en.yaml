statement: |-
  You are given a class `Rectangle` that produces <q>ASCII
      art</q> rectangles such as the following:

  ```
  +-------------+
  |             |
  |             |
  |             |
  |             |
  |             |
  +-------------+
  ```

  The code is given below.

  Your task is to produce a subclass `TitledRectangle` that
      produces figures such as

  ```
  +-------------+
  |             |
  |             |
  |    Hello    |
  |             |
  |             |
  +-------------+
  ```
