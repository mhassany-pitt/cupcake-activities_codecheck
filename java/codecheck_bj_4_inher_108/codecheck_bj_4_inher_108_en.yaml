statement: "Enumerated types in Java are quite powerful, in that they can contain methods and instance variables.  An enum\
  \ type class automatically has a static `values`\n\tmethod added by the compiler that returns an array containing all of\
  \ the values of the enum in the order in which they were declared.\n\nYou will complete the `Elements` enumeration which\
  \ declares elements with their symbols and melting points. Your tasks are as follows:\n\n<ul>\n<li>Complete the declaration\
  \ of the `Elements` enum class using the table of elements given below</li>\n<li>Complete the `getMeltedElements` method\
  \ that returns a list of all elements that will melt at a given temperature.</li>\n</ul>\nTable of melting points:\n\n<table\
  \ border=\"1\">\n<tr align=\"center\">\n<td>Element</td>\n<td>Symbol</td>\n<td>Melting Point</td>\n</tr>\n<tr align=\"center\"\
  >\n<td>Hydrogen</td>\n<td>H</td>\n<td>-258.975</td>\n</tr>\n<tr align=\"center\">\n<td>Oxygen</td>\n<td>O</td>\n<td>-222.65</td>\n\
  </tr>\n<tr align=\"center\">\n<td>Nitrogen</td>\n<td>N</td>\n<td>-209.86</td>\n</tr>\n<tr align=\"center\">\n<td>Chlorine</td>\n\
  <td>Cl</td>\n<td>-100.84</td>\n</tr>\n<tr align=\"center\">\n<td>Mercury</td>\n<td>Hg</td>\n<td>-38.72</td>\n</tr>\n<tr\
  \ align=\"center\">\n<td>Potassium</td>\n<td>K</td>\n<td>63.35</td>\n</tr>\n<tr align=\"center\">\n<td>Sodium</td>\n<td>Na</td>\n\
  <td>98.0</td>\n</tr>\n</table>"
