statement: |-
  <p>Complete the <code>Sentence</code> class below so that it implements the
      <code>Measurable</code> interface. The measure of a sentence should be the
      number of words. For example, </p>

      <pre>new Sentence("Mary had a little lamb.").getMeasure()</pre>

      <p>should return 5. </p>
elements:
- type: locked
  location:
    snippet: "public class Sentence implements Measurable\n{\n   /**\n      Constructs a sentence.\n      @param text the\
      \ text of the sentence. \n   */\n   public Sentence(String text)\n   {\n      int n = text.length();\n      String punctuation\
      \ = text.substring(n - 1, n);\n      words = text.substring(0, n - 1).split(\"\\\\s+\");\n   }\n   \n   /**\n      Returns\
      \ a word in this sentence.\n      @param the index of the word \n      @return the ith word or an empty string if i\
      \ is < 0\n      or >= the number of words in this sentence\n   */\n   public String getWord(int i)\n   {\n      if (i\
      \ >= 0 && i < words.length)\n         return words[i];\n      else\n         return \"\";\n   }\n   \n   public String\
      \ toString()\n   {\n      String r = \"\";\n      for (String w : words)\n      {\n         if (r.length() > 0) r +=\
      \ \" \";\n         r += w;\n      }\n      return r + punctuation;\n   }\n\n"
