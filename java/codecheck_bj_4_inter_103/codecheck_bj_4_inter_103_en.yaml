statement: |-
  <p>Some objects can be doubled, for example a bank account. The result
      would be a bank account with twice the balance. Some objects can't be
      doubled. For example, there is no double of a dime coin—no twenty
      cent coin exists. </p>

      <p>The <code>Doublable</code> interface specifies a method for making an
      object that is double of the current one. It should only be implemented by
      classes for which doubling makes sense.</p>

      <p>Your job is to modify the <code>Word</code> class of chapter 6 (which is
      reproduced below, with the bugs fixed) so that it implements the
      <code>Doublable</code> interface. Doubling a word should repeat its text. For
      example, </p>

      <pre>new Word("Java").makeDouble()</pre>

      <p>should produce a <code>Word</code> object with text <code>"JavaJava"</code>.
      </p>
