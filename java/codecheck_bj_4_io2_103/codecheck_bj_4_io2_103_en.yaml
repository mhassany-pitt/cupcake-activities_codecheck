statement: "Your task is to swap all letters A with O and all letters a with o in a\n    RandomAccessFile. Simply read a byte\
  \ at a time, and if you find a letter\n    to be swapped, move one byte back. \n\nFor example, when you process a file containing\
  \ the text of a\n    well-known childrens song, it will be transformed into\n\n```\n    Mory hod o little lomb,\n    little\
  \ lomb, little lomb,\n    Mory hod o little lomb, its fleece wos white os snaw.\n```"
elements:
- type: editable
  location:
    snippet: "import java.io.IOException;\nimport java.io.RandomAccessFile;\n\npublic class TextMangler\n{\n   public static\
      \ void swapAsAndOs(RandomAccessFile file) throws IOException\n   {\n      long pos = 0;\n      while (pos < file.length())\n\
      \      {\n         char c = (char) file.read();\n         char replacement = 0;\n         if (c == 'a') replacement\
      \ = 'o';\n         if (c == 'A') replacement = 'O';\n         else if (c == 'o') replacement = 'a';\n         else if\
      \ (c == 'O') replacement = 'A';\n         if (replacement != 0)\n         {\n            file.seek(pos);\n         \
      \   file.write((byte) replacement);\n         }\n         pos++;\n      }\n   }   \n   \n   // this method checks your\
      \ work\n   \n   public static void main(String[] args) throws IOException\n   {\n      RandomAccessFile file = new RandomAccessFile(\"\
      data.txt\", \"rw\");\n      swapAsAndOs(file);\n      file.close();\n   }   \n}\n"
