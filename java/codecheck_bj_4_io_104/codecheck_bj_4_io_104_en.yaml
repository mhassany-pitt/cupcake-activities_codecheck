statement: |-
  In the following code, catch the `NumberFormatException` that is
      thrown when the argument of `Integer.parseInt` does not represent a
      number.

  If either of the strings does not represent a number, use zero instead
      when forming the sum.
elements:
- type: editable
  location:
    snippet: |
      // TODO: Determine whether a or b do not represent an integer
      // by catching the NumberFormatException. If either one is not an integer,
      // use the value 0 when computing the sum.

      public class Numbers
      {
         public int add(String a, String b)
         {
            int x = Integer.parseInt(a);
            int y = Integer.parseInt(b);
            return x + y;
         }
      }
