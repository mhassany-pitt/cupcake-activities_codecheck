statement: |-
  Your task is to concatenate all elements in a linked list of strings
      backwards, starting at the end of the list. For example, if a linked list
      contains the strings

  ```
  Mary, had, a, little, lamb
  ```

  you should return the string `"lamblittleahadMary"`.
