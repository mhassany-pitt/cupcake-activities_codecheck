      \ an iterator for iterating through this list\n   */\n   public ListIterator listIterator()\n   {  \n      return new\
      \ LinkedListIterator();\n   }\n   \n   private Node first;\n   \n   private class Node\n   {  \n      public Object\
      \ data;\n      public Node next;\n   }\n\n   private class LinkedListIterator implements ListIterator\n   {  \n    \
      \  /**\n         Constructs an iterator that points to the front\n         of the linked list.\n      */\n      public\
      \ LinkedListIterator()\n      {  \n         position = null;\n         previous = null;\n      }\n      \n      /**\n\
      \         Moves the iterator past the next element.\n         @return the traversed element\n      */\n      public\
