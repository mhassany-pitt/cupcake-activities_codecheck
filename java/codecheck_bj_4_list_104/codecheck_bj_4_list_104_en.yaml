statement: |-
  <p>Your task is to add a <code>rotate</code> method to the <code>LinkedList</code>
      class of Section 15.2 that rotates the elements of a linked list so that
      the second element becomes the first, the third the second, and so on. The
      first element becomes the last element. For example, after rotating the
      list containing the elements </p>

      <pre>Mary, had, a, little, lamb</pre>

      <p>the list becomes</p>

      <pre>had, a, little, lamb, Mary</pre>
