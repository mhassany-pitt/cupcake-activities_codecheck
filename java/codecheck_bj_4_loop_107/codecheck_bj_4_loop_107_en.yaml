statement: |-
  <p>Consider an image that is composed of a number of colored small squares,
  each colored in one of these 8 colors: red, green, blue, cyan, magenta, yellow,
  black, white. The colors are stored in a <code>String</code> using the first
  letter of each color (R, G, B, C, M, Y, K, W). Each row in the image is
  terminated by a newline character (<code>'\n'</code>). Here is an example of an
  image:</p>
  <pre>String imageCode = "RRR\nRGR\nRRR\n";</pre>

  <p>This is a green square surrounded by red squares.</p>

  <p>Your task is to write a method that doubles the image in size, making each
  square twice as large in each direction. For example, when calling
  <code>doubleImage</code> with <code>imageCode</code>, the returned image is</p>
  <pre>"RRRRRR\nRRRRRR\nRRGGRR\nRRGGRR\nRRRRRR\nRRRRRR\n"</pre>

  <p><img src="data:image/png;base64,"/></p>
