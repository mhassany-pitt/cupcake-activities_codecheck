statement: "A simple technique for compressing an image is run-length encoding. The\ncolor of each pixel or area is specified\
  \ for an image. The color pallette can\nbe specified by the first letter of each color (R, G, B, C, M, Y, K, W) - red,\n\
  green, blue, cyan, magenta, yellow, black, white. An example 6 by 4 image is:\n\n```\n    RRRGGGYYYYWBWWRGBBBBBRRR\n```\n\
  \nRun-length encoding counts the number of each color in a group and replaces the\nindividual color values by a number and\
  \ the color. For our example, this would\ngive: \n\n```\n   3R3G4Y1W1B2W1R1G5B3R\n```\n\nComplete the `compressImage` method\
  \ to run-length compress a\nstring of characters."
