statement: |-
  Your task is to draw  *n* balloons centered at random positions, each
  with a randomly colored circle and a white string.

   The `BalloonComponent` class generates *n* balloons
  centered at random positions in the frame and draws them with a randomly
  colored circle and a white string. The `Balloon` class stores an
  `Ellipse2D.Double` object that defines the circle and a
  `Line2D.Double` object that defines the string.
