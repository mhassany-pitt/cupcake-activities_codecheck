    snippet: "import java.io.InputStream;\nimport java.io.IOException;\nimport java.io.OutputStream;\nimport java.io.PrintWriter;\n\
      import java.net.Socket;\nimport java.util.Scanner;\n\npublic class OracleClient\n{\n   public static String getAnswer(String\
      \ question)\n      throws IOException\n   {\n      OracleServer.start();\n      final int PORT = 7777;\n      \n   \
      \   // Connect to the port on localhost\n      \n      // Send the question\n      \n      // Get the response\n   \
      \   \n      // Close the socket\n      \n      // Return the response\n   }\n}\n"
