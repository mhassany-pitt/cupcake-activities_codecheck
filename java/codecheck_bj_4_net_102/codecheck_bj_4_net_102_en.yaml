statement: |-
  <p>Your task is to provide an oracle server at port 7777 on the local
      host. The oracle protocol is very simple. The client sends a single line
      containing a question to the oracle server, and the oracle server sends
      the answer in a single line and then disconnects.</p>

      <p>The oracle server is not a real oracle. It simply checks whether the
      input is an actual question (that is, a line starting with "where",
      "when", "what", "why", "how", "who", "which"). If so, it sends the
      response "The answer is <a
      href="http://en.wikipedia.org/wiki/The_Answer_to_Life,_the_Universe,_and_Everything">42</a>.".
      Otherwise, it sends the response "That was not a question."</p>
