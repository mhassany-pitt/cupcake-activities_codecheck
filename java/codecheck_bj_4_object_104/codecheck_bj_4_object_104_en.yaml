statement: |-
  Your task is to translate the rectangle `box2` in the program below so that
      the intersection of `box` and `box2` has area 100.

  Hint: Draw a picture that shows the positions of `box1` and
  `box2`. Then move `box2` so that it overlaps with
  `box1` in a 10 by 10 square.
elements:
- type: editable
  location:
    snippet: |
      import java.awt.Rectangle;

      public class IntersectionTester
      {
         public static void main(String[] args)
         {
            Rectangle box1 = new Rectangle(5, 10, 20, 30);
            Rectangle box2 = new Rectangle(10, 15, 20, 30);
            // now translate box2
            . . .
            Rectangle box = box1.intersection(box2);
            double area = box.getWidth() * box.getHeight();
            System.out.println(area);
            System.out.println("Expected: 100");
         }
      }
