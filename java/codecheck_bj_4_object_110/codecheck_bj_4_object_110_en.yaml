statement: |-
  <p>Draw two intersecting rectangles and color their intersection black.</p>
  <p>Use <code>draw</code> to draw the outline of <code>box1</code> and <code>box2</code>. Create a third rectangle, <code>box3</code>, where the two rectangles intersect.  Use <code>fill</code> to draw <code>box3</code> as a filled rectangle. </p>
