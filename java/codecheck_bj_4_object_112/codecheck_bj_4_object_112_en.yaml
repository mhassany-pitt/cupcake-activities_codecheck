statement: Complete the `ThreeButtonComponent` class to draw three boxes that look like push buttons.  Each box is a `Rectangle`
  drawn in `Color.GRAY` using the Graphics2D method `fill3DRect`. Look in the Graphics2D class API for a complete description
  of this method.  Use `true` for the value for the `boolean raised` parameter.  (We will learn more about the `boolean` data
  type in Chapter 4.)  The center of each box has a different colored circle, `Color.RED`, `Color.GREEN`, or `Color.CYAN`.
