statement: |-
  <p>Intuitively, every square is a rectangle, so it is tempting to use
      inheritance for implementing a square:</p>

      <pre>public class Square extends Rectangle </pre>

      <p>However, the devil is in the details. The <code>Square</code> class
      inherits all mutators of <code>Rectangle</code>, and some of them can mutate a
      square into a non-square shape.</p>

      <p>The safer approach is to use aggregation:</p>

      <pre>public class Square
  {
     . . .
     private Rectangle rect;
  }</pre>

      <p>Now we do not inherit any <code>Rectangle</code> methods. Instead, all
      methods must be implemented so that they operate on the <code>rect</code>
      instance field. Your task is to implement the constructor and three
      methods. </p>
