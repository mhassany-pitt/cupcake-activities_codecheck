  location:
    snippet: "// to \"A=Deposit, B=Withdrawal, C=Transfer, D=Cancel: \" and implement\n// the transfer feature.\n\nimport\
      \ java.io.IOException;\nimport java.util.Scanner;\n\n/**\n   A text-based simulation of an automatic teller machine.\n\
      */\npublic class ATMSimulator\n{  \n   public static void main(String[] args)\n   {  \n      ATM theATM;\n      try\n\
      \      {  \n         Bank theBank = new Bank();\n         theBank.readCustomers(\"customers.txt\");\n         theATM\
      \ = new ATM(theBank);\n      }\n      catch(IOException e)\n      {  \n         System.out.println(\"Error opening accounts\
      \ file.\");\n         return;\n      }\n\n      Scanner in = new Scanner(System.in);\n\n      while (true)\n      {\n\
      \         int state = theATM.getState();\n         if (state == ATM.START)\n         {\n            System.out.print(\"\
      Enter customer number: \");\n            int number = in.nextInt();\n            if (number == 0) return;\n        \
      \    theATM.setCustomerNumber(number);            \n         }\n         else if (state == ATM.PIN)\n         {\n  \
      \          System.out.print(\"Enter PIN: \");\n            int pin = in.nextInt();\n            theATM.selectCustomer(pin);\n\
      \         }\n         else if (state == ATM.ACCOUNT)\n         {\n            System.out.print(\"A=Checking, B=Savings,\
      \ C=Quit: \");\n            String command = in.next();\n            if (command.equalsIgnoreCase(\"A\"))\n        \
      \       theATM.selectAccount(ATM.CHECKING);\n            else if (command.equalsIgnoreCase(\"B\"))\n               theATM.selectAccount(ATM.SAVINGS);\n\
      \            else if (command.equalsIgnoreCase(\"C\"))\n               theATM.reset();\n            else\n         \
      \      System.out.println(\"Illegal input!\");                        \n         }\n         else if (state == ATM.TRANSACT)\n\
      \         {\n            System.out.println(\"Balance=\" + theATM.getBalance());\n            System.out.print(\"A=Deposit,\
      \ B=Withdrawal, C=Cancel: \");\n            String command = in.next();\n            if (command.equalsIgnoreCase(\"\
      A\"))\n            {\n               System.out.print(\"Amount: \");\n               double amount = in.nextDouble();\n\
      \               theATM.deposit(amount);\n               theATM.back();\n            }\n            else if (command.equalsIgnoreCase(\"\
      B\"))\n            {\n               System.out.print(\"Amount: \");\n               double amount = in.nextDouble();\n\
      \               theATM.withdraw(amount);\n               theATM.back();\n            }\n            else if (command.equalsIgnoreCase(\"\
      C\"))\n               theATM.back();\n            else\n               System.out.println(\"Illegal input!\");     \
      \                               \n         }         \n      }\n   }\n}\n\n"
