statement: "<p>In this assignment, a <code>transfer</code> method has been added to the\n    <code>ATM</code> class of section\
  \ 12.5:</p>\n\n    <pre>public class ATM \n   /** \n      Transfers between the current account and the other account\n\
  \      of the same customer.\n      (Precondition: state is TRANSACT)\n   */\n   public void transfer(double value)\n  \
  \ {\n      . . .\n      back();\n   }</pre>\n\n    <p>Your task is to change the command-line user interface of the\n  \
  \  <code>ATMSimulator</code> so that the menu </p>\n\n    <pre>A=Deposit, B=Withdrawal, C=Cancel: </pre>\n\n    <p>is replaced\
  \ by</p>\n\n    <pre>A=Deposit, B=Withdrawal, C=Transfer, D=Cancel: </pre>\n\n    <p>Of course, you should now carry out\
  \ the appropriate actions when the\n    user selects options C or D.</p>"
