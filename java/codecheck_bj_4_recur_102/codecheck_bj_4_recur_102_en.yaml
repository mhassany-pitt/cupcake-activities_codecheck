statement: "Two strings of equal length can be interlaced like the teeth of a\n    zipper to form a new word. For example,\
  \ interlacing `cota` and\n`rain` yields `c**r**o**a**t**i**a**n**`. The\n    following class constructs a `ZipperWord` from\
  \ two strings. \n\nYour task is to complete the `toString` method using recursion.\n    Hint: Concatenate the first letter\
  \ from each string, follwed by a simpler\n`ZipperWord` that is made from the tails of the strings\n    (`first.substring(1)`\
  \ and `second.substring(1)`)."
