statement: "Two strings of equal length can be interlaced like the teeth of a\n    zipper to form a new word. For example,\
  \ interlacing `cota` and\n`rain` yields `c**r**o**a**t**i**a**n**`. The\n    following class constructs a `ZipperWord` from\
  \ two strings. \n\nYour task is to complete the implementation of the\n`toStringHelper` method below. That method computes\
  \ the zipped word\n    resulting from interleaving characters from `first` and\n`second`, starting with the given position.\
  \ Interleave the\n    characters at that position and combine with a recursive call to\n`toStringHelper`."
