statement: "You are given two strings of equal length. Your task is to generate all\n<q>zipper words</q> that can be produced\
  \ from them. A zipper word\n    is made by interleaving the characters at the same index from each string.\n    Some indexes\
  \ may be skipped. However, a zipper word has length at least 2.\n    For example, if the two strings are \n\n```\n**a**n**t**\n\
  **b**u**g**\n```\n\nthen a zipper word is \n\n```\n**abtg**\n```\n\nComplete the following class to generate an array list\
  \ of all zipper\n    words. \n\nHint: (1) There are two kinds of zipper words that can be made of\n`**a**nt` and `**b**ug`:\
  \ those that start with\n`**ab**` and those that don't. In either case, the suffix is a\n    zipper word made of `nt` and\
  \ `ug`. (2) If the length of the\n    strings is is zero, there are no zipper words."
