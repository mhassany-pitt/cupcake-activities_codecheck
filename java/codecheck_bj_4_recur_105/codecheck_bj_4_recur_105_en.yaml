statement: "A recursive <q>squid</q> is a **squ**are **i**n a\n**d**iamond containing another <q>squid</q>.\n\nYour task is\
  \ to implement the `draw` method of the squid. Draw\n    the diamond, draw the square, then make another `Squid` with half\n\
  \    the radius, and call its `draw` method. However, if the radius is\n    too small, do nothing. \n\nViewer and component\
  \ classes have been provided."
