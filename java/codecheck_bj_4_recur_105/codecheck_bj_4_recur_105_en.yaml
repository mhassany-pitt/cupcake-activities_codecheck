statement: |-
  <p>A recursive <q>squid</q> is a <b>squ</b>are <b>i</b>n a
      <b>d</b>iamond containing another <q>squid</q>.</p>

      <p>Your task is to implement the <code>draw</code> method of the squid. Draw
      the diamond, draw the square, then make another <code>Squid</code> with half
      the radius, and call its <code>draw</code> method. However, if the radius is
      too small, do nothing. </p>

      <p>Viewer and component classes have been provided.</p>
