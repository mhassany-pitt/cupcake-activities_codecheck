statement: |-
  <p>Complete the static <code>mkString</code> method in the <code>MyMethods</code> class so that it formats an array of <code>int</code> values, with the elements separated by
  a given separator string.</p>
  <p>For example, the call <code>mkString(new int[] { 1, 2, 3, 4 }, "|")</code> should
  return the string "1|2|3|4".</p>
