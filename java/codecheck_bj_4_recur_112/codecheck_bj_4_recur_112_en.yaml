statement: |-
  <p>Complete the static <code>reverseHelper</code> method so that the <code>reverse</code> method returns a String that is the reverse of the parameter <code>s</code>. </p>
  <p>The helper method should build up the reversed string like this:</p>
  <pre>reverseHelper("fred", "")
  = reverseHelper("red", "f")
  = reverseHelper("ed", "rf")
  = reverseHelper("d", "erf")
  = reverseHelper("", "derf")
  = "derf"
  </pre>
