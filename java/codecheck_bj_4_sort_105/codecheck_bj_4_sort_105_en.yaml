statement: "Your task is to implement a number guesser that works on the principle\n    of a binary search. In each step,\
  \ the guesser cuts the query interval in\n    half. When the interval contains a single number, it proclaims the\n    answer.\n\
  \nSuppose your guesser is asked to guess a number between 1 and 100. It\n    starts with the query\n\n```\n&gt;50\n```\n\
  \n50 is the midpoint between 1 and 100.\n\nThe person who knows the number says `false`. The next query is\n\n```\n&gt;25\n\
  ```\n\n25 is the midpoint between 1 and 50.\n\nThe answer is still `false`, and the next query is \n\n```\n&gt;13\n```\n\
  \nThe answer is still `false`, and the next query is\n\n```\n&gt;7\n```\n\nNow the answer is `true`, and the next query\
  \ is \n\n```\n&gt;10\n```\n\nThe answer is again `true`, and the next query is\n\n```\n&gt;12\n```\n\nThe answer is once\
  \ again `true`, and now the guesser proclaims\n\n```\n=13\n```\n\nAn object of your class will be called like this:\n\n\
  ```\nwhile (...)\n{\n   String guess = guesser.nextGuess();\n   if (guess.startsWith(\"=\"))\n   {\n      // display answer\
  \ and terminate loop\n      ...\n   }\n   else\n   { \n      // show guess to person who knows the answer\n      ...\n \
  \     // get response from person\n      boolean resp = ...; \n      guesser.response(resp);\n   }\n}\n```"
