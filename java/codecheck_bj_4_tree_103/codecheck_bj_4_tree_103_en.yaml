      \   {  \n         int comp = newNode.data.compareTo(data);\n         if (comp < 0)\n         {  \n            if (left\
      \ == null) left = newNode;\n            else left.addNode(newNode);\n         }\n         else if (comp > 0)\n     \
      \    {  \n            if (right == null) right = newNode;\n            else right.addNode(newNode);\n         }\n  \
      \    }\n   \n      public Comparable data;\n      public Node left;\n      public Node right;\n   }\n}\n\n\n\n"
