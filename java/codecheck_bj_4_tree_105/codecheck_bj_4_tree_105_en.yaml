statement: "It is possible to provide a fast priority queue implementation if the\n    inserted items have a bounded number\
  \ of integer priorities. \n\nMake an array list of linked lists. The linked list at index `i`\n    holds all items with\
  \ priority `i`. To add an element, simply add it\n    to the end of the `i`th priority list. To remove an element, remove\n\
  \    it from the front of the non-empty list with the lowest priority. \n\n<img src=\"data:image/png;base64,\"\
  \ />\n\nComplete the following class that implements this idea. (Note that the\n    elements stored in this priority queue\
  \ do not implement the\n`Comparable` interface. Instead, an integer priority must be\n    specified together with each item\
  \ as it is inserted.)"
