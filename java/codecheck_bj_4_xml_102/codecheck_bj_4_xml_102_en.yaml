statement: "An RSS file contains a sequence of `item` elements inside a\n`channel` element. Here is a sample RSS file:\n\n\
  ```\n&lt;?xml version=\"1.0\"?&gt;\n&lt;rss version=\"2.0\"&gt;\n  &lt;channel&gt;\n    &lt;title&gt;Liftoff News&lt;/title&gt;\n\
  \    &lt;link&gt;http://liftoff.msfc.nasa.gov/&lt;/link&gt;\n    &lt;description&gt;Liftoff to Space Exploration.&lt;/description&gt;\n\
  \    &lt;language&gt;en-us&lt;/language&gt;\n    &lt;pubDate&gt;Tue, 10 Jun 2003 04:00:00 GMT&lt;/pubDate&gt;\n    &lt;lastBuildDate&gt;Tue,\
  \ 10 Jun 2003 09:41:01 GMT&lt;/lastBuildDate&gt;\n    &lt;docs&gt;http://blogs.law.harvard.edu/tech/rss&lt;/docs&gt;\n \
  \   &lt;generator&gt;Weblog Editor 2.0&lt;/generator&gt;\n    &lt;managingEditor&gt;editor@example.com&lt;/managingEditor&gt;\n\
  \    &lt;webMaster&gt;webmaster@example.com&lt;/webMaster&gt;\n\n    &lt;item&gt;\n      &lt;title&gt;Star City&lt;/title&gt;\n\
  \      &lt;link&gt;http://liftoff.msfc.nasa.gov/news/2003/news-starcity.asp&lt;/link&gt;\n      &lt;description&gt;How do\
  \ Americans get ready to work with Russians aboard the\n        International Space Station? They take a crash course in\
  \ culture, language\n        and protocol at Russia's Star City.&lt;/description&gt;\n      &lt;pubDate&gt;Tue, 03 Jun 2003\
  \ 09:39:21 GMT&lt;/pubDate&gt;\n      &lt;guid&gt;http://liftoff.msfc.nasa.gov/2003/06/03.html#item573&lt;/guid&gt;\n  \
  \  &lt;/item&gt;\n    \n    &lt;item&gt;\n      &lt;title&gt;Space Exploration&lt;/title&gt;\n      &lt;link&gt;http://liftoff.msfc.nasa.gov/&lt;/link&gt;\n\
  \      &lt;description&gt;Sky watchers in Europe, Asia, and parts of Alaska and Canada\n        will experience a partial\
  \ eclipse of the Sun on Saturday, May 31st.&lt;/description&gt;\n      &lt;pubDate&gt;Fri, 30 May 2003 11:06:42 GMT&lt;/pubDate&gt;\n\
  \      &lt;guid&gt;http://liftoff.msfc.nasa.gov/2003/05/30.html#item572&lt;/guid&gt;\n    &lt;/item&gt;\n    \n    &lt;item&gt;\n\
  \      &lt;title&gt;The Engine That Does More&lt;/title&gt;\n      &lt;link&gt;http://liftoff.msfc.nasa.gov/news/2003/news-VASIMR.asp&lt;/link&gt;\n\
  \      &lt;description&gt;Before man travels to Mars, NASA hopes to design new engines\n        that will let us fly through\
  \ the Solar System more quickly.  The proposed\n        VASIMR engine would do that.&lt;/description&gt;\n      &lt;pubDate&gt;Tue,\
  \ 27 May 2003 08:37:32 GMT&lt;/pubDate&gt;\n      &lt;guid&gt;http://liftoff.msfc.nasa.gov/2003/05/27.html#item571&lt;/guid&gt;\n\
  \    &lt;/item&gt;\n    \n    &lt;item&gt;\n      &lt;title&gt;Astronauts' Dirty Laundry&lt;/title&gt;\n      &lt;link&gt;http://liftoff.msfc.nasa.gov/news/2003/news-laundry.asp&lt;/link&gt;\n\
  \      &lt;description&gt;Compared to earlier spacecraft, the International Space\n        Station has many luxuries, but\
  \ laundry facilities are not one of them.\n        Instead, astronauts have other options.&lt;/description&gt;\n      &lt;pubDate&gt;Tue,\
  \ 20 May 2003 08:56:02 GMT&lt;/pubDate&gt;\n      &lt;guid&gt;http://liftoff.msfc.nasa.gov/2003/05/20.html#item570&lt;/guid&gt;\n\
  \    &lt;/item&gt;\n  &lt;/channel&gt;\n&lt;/rss&gt;\n```\n\nNote: The RSS format is documented at <a\n    href=\"http://cyber.law.harvard.edu/rss/rss.html\"\
  >http://cyber.law.harvard.edu/rss/rss.html</a>.\n\nYour task is to count the number of items, assuming that the file only\n\
  \    contains one channel."
