statement: "<p>An RSS file describes a set of news items. Here is a sample RSS\n    file:</p>\n\n    <pre>&lt;?xml version=\"\
  1.0\"?&gt;\n&lt;rss version=\"2.0\"&gt;\n  &lt;channel&gt;\n    &lt;item&gt;\n      &lt;title&gt;Star City&lt;/title&gt;\n\
  \      &lt;link&gt;http://liftoff.msfc.nasa.gov/news/2003/news-starcity.asp&lt;/link&gt;\n      &lt;description&gt;How do\
  \ Americans get ready to work with Russians aboard the\n        International Space Station? They take a crash course in\
  \ culture, language\n        and protocol at Russia's Star City.&lt;/description&gt;\n      &lt;pubDate&gt;Tue, 03 Jun 2003\
  \ 09:39:21 GMT&lt;/pubDate&gt;\n    &lt;/item&gt;\n    \n    &lt;item&gt;\n      &lt;title&gt;Space Exploration&lt;/title&gt;\n\
  \      &lt;link&gt;http://liftoff.msfc.nasa.gov/&lt;/link&gt;\n      &lt;description&gt;Sky watchers in Europe, Asia, and\
  \ parts of Alaska and Canada\n        will experience a partial eclipse of the Sun on Saturday, May 31st.&lt;/description&gt;\n\
  \      &lt;pubDate&gt;Fri, 30 May 2003 11:06:42 GMT&lt;/pubDate&gt;\n    &lt;/item&gt;\n    \n    &lt;item&gt;\n      &lt;title&gt;The\
  \ Engine That Does More&lt;/title&gt;\n      &lt;link&gt;http://liftoff.msfc.nasa.gov/news/2003/news-VASIMR.asp&lt;/link&gt;\n\
  \      &lt;description&gt;Before man travels to Mars, NASA hopes to design new engines\n        that will let us fly through\
  \ the Solar System more quickly.  The proposed\n        VASIMR engine would do that.&lt;/description&gt;\n      &lt;pubDate&gt;Tue,\
  \ 27 May 2003 08:37:32 GMT&lt;/pubDate&gt;\n    &lt;/item&gt;\n  &lt;/channel&gt;\n&lt;/rss&gt;</pre>\n\n    <p>Note: The\
  \ RSS format is documented at <a\n    href=\"http://cyber.law.harvard.edu/rss/rss.html\">http://cyber.law.harvard.edu/rss/rss.html</a>.</p>\n\
  \n    <p>Your task is to complete the <code>createItem</code> method below. Use the\n    current date (<code>new Date().toString()</code>)\
  \ for the\n    <code>pubDate</code>.</p>"
